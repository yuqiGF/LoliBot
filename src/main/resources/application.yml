# LoliBot 基础配置
# 说明：
# 1. 本文件只放非敏感默认值，API Key、机器人地址等私密配置请写入 application-local.yml。
# 2. Spring 会自动加载 application-local.yml；该文件已在 .gitignore 中忽略。

bot:
  # 身份和群号只在 application-local.yml 中填写，0 表示未配置。
  account-id: 0
  master-qq: 0
  bird-qq: 0
  bad-gay-qq: 0
  qiqi-qq: 0
  scheduled-group: 0
  advanced-groups: []

server:
  port: 8082

spring:
  application:
    name: loli_bot

  config:
    import: optional:application-local.yml

  profiles:
    active: local

shiro:
  ws:
    server:
      enable: true
      # QQ 机器人 WebSocket 地址，例如 ws://127.0.0.1:3001
      url: ""
  plugin-list:
    # 默认使用 @Shiro 自动扫描插件；只有需要手动指定插件时再配置此列表。

# WakaTime 编程统计配置；建议在 application-local.yml 中填写。
wakatime:
  timezone: Asia/Shanghai
  api-key:
  # 兼容旧配置名，后续可统一迁移到 api-key。
  api_key:

# PRTS Wiki 查询配置。
prts:
  base-url: https://m.prts.wiki

# 日语词典学习卡，Jisho 词条数据来自 JMdict。
moji:
  base-url: https://jisho.org/api/v1/search/words

# Typst 用于渲染扫雷棋盘和萌百信息卡。
typst:
  # typst 可执行文件路径；如果已加入 PATH，保持 typst 即可。
  path: typst
  # 额外字体目录，多个目录使用系统路径分隔符分开。
  font-path: fonts

# DeepSeek 临时问答配置；建议在 application-local.yml 中填写。
deepseek:
  api-key:

# LangChain4j / DashScope 配置；API Key 由本地配置覆盖。
langchain4j:
  community:
    dashscope:
      chat-model:
        model-name: qwen3-max
        api-key:
        enable-search: true
      embedding-model:
        model-name: text-embedding-v4
        api-key:
      streaming-chat-model:
        model-name: qwen3-max
        api-key:


# 聊天档案与群语录均保存在工作目录的 data 下。
chat:
  # 关闭后只保留主动 @ 聊天和群复读，不收集上下文、不调用自动接话模型。
  auto-chat-enabled: false
  state-file: data/chat-profiles.json
